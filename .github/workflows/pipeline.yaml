name: Deploy

on:
  push:
    branches:
      - pipeline

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4        
        with:          
          node-version: '24'
      - name: install dependencies
        run: npm ci
      - name: Check style        
        run: npm run eslint

  deploy_app:
    runs-on: ubuntu-latest
    needs: [build_and_test]
    steps:
    - name: Trigger deployment
      run: curl ${{ secrets.RENDER_DEPLOY_HOOK }}
